name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python-is-python3 \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            ccache

    - name: Download and Setup NDK r25b
      run: |
        mkdir -p /home/runner/android-ndk
        cd /home/runner/android-ndk
        curl -O https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        rm -f android-ndk-r25b-linux.zip

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install git+https://github.com/kivy/buildozer.git@master
        pip install git+https://github.com/kivy/python-for-android.git@release-2024.01.21

    - name: Clean Cache
      run: |
        rm -rf .buildozer bin

    - name: Build APK
      env:
        ANDROIDNDK: /home/runner/android-ndk/android-ndk-r25b
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Cricket-Platinum-APK
        path: bin/*.apk
